<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1F1F1D;
            color: #F4F4F4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Ambient subtle white glow */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            background: linear-gradient(180deg, #2A2A28 0%, #222220 100%);
            border: 1px solid #4A4A48;
            border-radius: 24px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            color: #F4F4F4;
            line-height: 1.3;
        }

        p {
            font-size: 1.05rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .site-link {
            color: #C8C8C8;
            text-decoration: none;
            transition: color 0.2s ease;
            word-break: break-all;
        }

        .site-link:hover {
            color: #FFFFFF;
            text-decoration: underline;
        }

        .discord-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #E5E5E3;
            color: #1F1F1D;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .discord-btn:hover {
            background-color: #FFFFFF;
            color: #1F1F1D;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <h1>site is not gone.<br>It will be back.</h1>
        <p>
            <a href="https://fearshoots.ace.me" target="_blank" class="site-link">https://fearshoots.ace.me</a>
        </p>

        <a href="https://discord.gg/spycord" target="_blank" class="discord-btn">
            Discord /spycord
        </a>
    </div>

</body>
</html>
